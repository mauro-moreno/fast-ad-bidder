# T112: ConfigMap for bidder configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: bidder-config
  namespace: fast-ad-bidder
  labels:
    app.kubernetes.io/name: fast-ad-bidder
    app.kubernetes.io/component: config
data:
  # Server configuration
  SERVER_PORT: "8080"
  SERVER_READ_TIMEOUT: "5s"
  SERVER_WRITE_TIMEOUT: "10s"
  
  # Database configuration (host from service)
  DB_HOST: "postgres-service.fast-ad-bidder.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "bidder"
  DB_SSL_MODE: "require"
  DB_MAX_OPEN_CONNS: "25"
  DB_MAX_IDLE_CONNS: "5"
  
  # InfluxDB configuration
  INFLUX_URL: "http://influxdb-service.fast-ad-bidder.svc.cluster.local:8086"
  INFLUX_ORG: "fast-ad-bidder"
  INFLUX_BUCKET: "metrics"
  
  # TLS configuration
  TLS_ENABLED: "true"
  TLS_CERT_FILE: "/etc/tls/tls.crt"
  TLS_KEY_FILE: "/etc/tls/tls.key"
  TLS_CA_FILE: "/etc/tls/ca.crt"
  TLS_CLIENT_AUTH: "require"
  
  # Logging
  LOG_LEVEL: "info"
  
  # Budget configuration
  BUDGET_RESET_HOUR: "0"
  
  # Win processing
  WIN_QUEUE_SIZE: "10000"
  WIN_WORKER_COUNT: "4"
  WIN_CACHE_TTL: "5m"
