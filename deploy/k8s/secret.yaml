# T112: Secret for sensitive bidder configuration
# NOTE: Replace base64-encoded values with actual secrets before applying
# Example: echo -n "your-password" | base64
apiVersion: v1
kind: Secret
metadata:
  name: bidder-secrets
  namespace: fast-ad-bidder
  labels:
    app.kubernetes.io/name: fast-ad-bidder
    app.kubernetes.io/component: config
type: Opaque
data:
  # Database credentials (base64 encoded)
  DB_USER: YmlkZGVy  # "bidder"
  DB_PASSWORD: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=  # "change-me-in-production"
  
  # InfluxDB token (base64 encoded)
  INFLUX_TOKEN: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=  # "change-me-in-production"
