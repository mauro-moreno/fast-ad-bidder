# T111: Grafana dashboard provisioning
apiVersion: 1

providers:
  - name: 'Bidder Dashboards'
    orgId: 1
    folder: 'Fast Ad Bidder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
